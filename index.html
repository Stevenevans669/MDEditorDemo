<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>测试首页</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px;
      background: #f7f7f9;
      color: #222;
    }

    .card {
      max-width: 640px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    p {
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .hint {
      color: #5f6368;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>测试页面</h1>
    <p>这是一个简单的 index 页面，用于基础展示与联调。</p>
    <p class="hint">更新时间：<span id="time"></span></p>
  </div>

  <script>
    document.getElementById('time').textContent = new Date().toLocaleString('zh-CN');
  </script>
</body>
</html>
